services:
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: jaeger
    environment:
       COLLECTOR_ZIPKIN_HTTP_PORT: 9411
    ports:
      - "16686:16686"    # Jaeger UI
      - "6831:6831/udp"  # agent/UDP (thrift) for libraries
      - "14268:14268"    # collector HTTP
      - "4317:4317"   
      - "4318:4318" 
    networks:
      - global-network

# networks:
#   global-network:
#     external: true
