
services:
  consul:
    image: consul:1.15.4
    container_name: consul
    ports:
      - "8500:8500"
    command: ["agent", "-dev", "-client=0.0.0.0"]
    networks:
      - global-network
  
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"     
      - "15672:15672"  
    networks:
      - global-network

    
  health-check:
    image: health-check
    container_name: health_check
    build:
      context: .
      dockerfile: ./Services/HealthCheck/HealthCheck.Application/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:9000
    ports:
      - "9000:9000"
    depends_on:
        - consul
        - rabbitmq
    networks: 
        - global-network
  
    

  # Gateway-////////////////////////////////////
  api-gateway:
    container_name: api_gateway
    build:
      context: .
      dockerfile: ./Gateways/Gateways.Ocelot/Dockerfile
    ports:
      - "7000:7000"
    environment:
      - ASPNETCORE_URLS=http://+:7000
      - CONSUL_HOST=consul
    depends_on:
      - consul
    networks:
      - global-network
 


  # Order Service-//////////////////////////////////

  orders.db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: orders_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Admin123*
    ports:
      - "1433:1433"
    networks:
      - order-network

  orders.api:
    container_name: orders_api
    build:
      context: .
      dockerfile: ./Services/Orders/Orders.API/Dockerfile

    image: orders-api
    environment:
      # ====== Kết nối database ======
      - ConnectionStrings__Database=Server=orders.db,1433;Database=OrderDb;User Id=sa;Password=Admin123*;TrustServerCertificate=True;
      - ASPNETCORE_URLS=http://+:7003

      # ====== Cấu hình Consul ======
      - ConsulConfig__Address=http://consul:8500
      - ConsulConfig__ServiceName=orders-api
      - ConsulConfig__ServicePort=7003

    depends_on:
      - orders.db
      - consul
      - rabbitmq
    ports:
      - "7003:7003"
    networks:
      - order-network
      - global-network



  # Auth Service-///////////////////////////////////
  auth.db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: auth_db
    environment:
    - ACCEPT_EULA=Y
    - SA_PASSWORD=Admin123*
    ports:
    - "1436:1433"
    networks:
    - global-network


  auth.api:
    container_name: auth_api
    build:
        context: .
        dockerfile: ./Services/Auth/Auth.API/Dockerfile
    image: auth-api
    environment:
        - ConnectionStrings__Database=Server=auth.db,1433;Database=AuthDb;User Id=sa;Password=Admin123*;TrustServerCertificate=True;
        - ASPNETCORE_URLS=http://+:7001
        - ConsulConfig__Address=http://consul:8500
        - ConsulConfig__ServiceName=auth-api
        - ConsulConfig__ServicePort=7001
    depends_on:
        - auth.db
        - consul
    ports:
        - "7001:7001"
    networks:
        - global-network

   
  # Voucher Service-///////////////////////////////////

  voucher.write.db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: voucher_write_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Admin123*
    ports:
      - "1434:1433"
    networks:
      - global-network


  voucher.command.api:
    container_name: voucher_command_api
    build:
        context: .
        dockerfile: ./Services/VoucherAPI/Voucher.CommandAPI/Dockerfile
    image: voucher-command-api
    environment:
        - ConnectionStrings__Database=Server=voucher.write.db,1433;Database=OrderDb;User Id=sa;Password=Admin123*;TrustServerCertificate=True;
        - ASPNETCORE_URLS=http://+:7004
        - ConsulConfig__Address=http://consul:8500
        - ConsulConfig__ServiceName=voucher-write-api
        - ConsulConfig__ServicePort=7004
    depends_on:
        - voucher.write.db
        - consul
        - rabbitmq
    ports:
        - "7004:7004"
    networks:
        - global-network
  

  voucher.read.db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: voucher_read_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Admin123*
    ports:
      - "1435:1433"
    networks:
      - global-network
  
  voucher.query.api:
    container_name: voucher_query_api
    build:
        context: .
        dockerfile: ./Services/VoucherAPI/Voucher.QueryAPI/Dockerfile
    image: voucher-query-api
    environment:
        - ConnectionStrings__Database=Server=voucher.read.db,1433;Database=OrderDb;User Id=sa;Password=Admin123*;TrustServerCertificate=True;
        - ASPNETCORE_URLS=http://+:7006
        - ConsulConfig__Address=http://consul:8500
        - ConsulConfig__ServiceName=voucher-read-api
        - ConsulConfig__ServicePort=7006
    depends_on:
        - voucher.read.db
        - consul
        - rabbitmq
    ports:
        - "7006:7006"
    networks:
        - global-network


   # Payment Service-///////////////////////////////////
  payment.api:
    container_name: payment_api
    build:
        context: .
        dockerfile: ./Services/Payment/Payment.API/Dockerfile

    image: payment-api
    environment:
        - ASPNETCORE_URLS=http://+:7005
        - ConsulConfig__Address=http://consul:8500
        - ConsulConfig__ServiceName=payment-api
        - ConsulConfig__ServicePort=7005
    depends_on:
        - consul
        - rabbitmq
    ports:
        - "7005:7005"
    networks:
        - global-network



networks:
  order-network:
    driver: bridge
  global-network:
    driver: bridge
